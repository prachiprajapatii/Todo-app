<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Edu+NSW+ACT+Hand+Pre:wght@400..700&family=Outfit:wght@100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="data">
        <h1>Todo List</h1>
        <br>
        <form>
            <div>
                <input id="textdata" type="text" placeholder="type here something..." minlength="3" maxlength="100"
                    value>
                <button id="addtodo">Add Todo</button>
            </div>
            <section class="todo-items">
                <ul id="todo-ul"></ul>

            </section>

        </form>
    </div>
    <script src="script.js"></script>
</body>

</html>
